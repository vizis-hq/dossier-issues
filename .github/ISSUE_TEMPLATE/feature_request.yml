name: Feature request
description: An idea for making dossier better
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
      description: The situation or task where dossier fell short — this helps more than a proposed solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it working. Sketches and examples welcome.
    validations:
      required: false
